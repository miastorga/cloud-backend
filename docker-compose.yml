version: '3.8'

services:
  # ============================================================
  # BASE DE DATOS ORACLE
  # ============================================================
  oracle-db:
    image: gvenzl/oracle-xe:latest
    container_name: oracle-db
    platform: linux/amd64
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=secret
      - APP_USER=transporte_user
      - APP_USER_PASSWORD=transporte_pass
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
    networks:
      - transporte-network

  # ============================================================
  # CLUSTER ZOOKEEPER (3 nodos)
  # ============================================================
  zookeeper1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    networks:
      - transporte-network

  zookeeper2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper2
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    networks:
      - transporte-network

  zookeeper3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper3
    ports:
      - "2183:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    networks:
      - transporte-network

  # ============================================================
  # CLUSTER KAFKA (3 brokers)
  # ============================================================
  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    networks:
      - transporte-network

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    networks:
      - transporte-network

  kafka3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:39092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:39092,EXTERNAL://0.0.0.0:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    networks:
      - transporte-network

  # ============================================================
  # KAFKA UI (visualización del clúster)
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: transporte-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092,kafka2:29092,kafka3:39092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - transporte-network

  # ============================================================
  # MICROSERVICIO 1: PRODUCTOR DE UBICACIONES
  # Genera ubicaciones GPS simuladas cada 1 segundo
  # Publica en tópico: ubicaciones_vehiculos
  # ============================================================
  ms-productor:
    build: ./ms-productor-ubicaciones
    container_name: ms-productor
    ports:
      - "8084:8081"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:19092,kafka2:29092,kafka3:39092
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - transporte-network

  # ============================================================
  # MICROSERVICIO 2: PROCESAMIENTO
  # Consume de: ubicaciones_vehiculos
  # Procesa y publica en: horarios
  # ============================================================
  ms-procesamiento:
    build: ./ms-procesamiento
    container_name: ms-procesamiento
    ports:
      - "8082:8082"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:19092,kafka2:29092,kafka3:39092
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - transporte-network

  # ============================================================
  # MICROSERVICIO 3: MONITORIZACIÓN
  # Consume de: ubicaciones_vehiculos + horarios
  # Persiste en Oracle Cloud y expone APIs REST
  # ============================================================
  ms-monitorizacion:
    build: ./ms-monitorizacion
    container_name: ms-monitorizacion
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521/xepdb1
      - SPRING_DATASOURCE_USERNAME=transporte_user
      - SPRING_DATASOURCE_PASSWORD=transporte_pass
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.OracleDialect
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:19092,kafka2:29092,kafka3:39092
      - AZURE_TENANT_NAME=EmpresaDuoc
      - AZURE_POLICY_NAME=B2C_1_B5_DUOC_FLOW
      - AZURE_CLIENT_ID=7f588d12-6261-4a95-b9ee-f2a0a329259a
    depends_on:
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started
      kafka3:
        condition: service_started
      oracle-db:
        condition: service_healthy
    networks:
      - transporte-network
    volumes:
      - horarios-data:/app/data/horarios

networks:
  transporte-network:
    driver: bridge

volumes:
  horarios-data:
  oracle-data: