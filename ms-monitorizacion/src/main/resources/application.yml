spring:
  application:
    name: ms-monitorizacion

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle-db:1521/xepdb1}
    username: ${SPRING_DATASOURCE_USERNAME:transporte_user}
    password: ${SPRING_DATASOURCE_PASSWORD:transporte_pass}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.OracleDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka1:19092,kafka2:29092,kafka3:39092}
    consumer:
      group-id: monitorizacion-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "ubicacion:com.transporte.monitorizacion.model.Ubicacion,horarioEvento:com.transporte.monitorizacion.dto.HorarioEventoDTO"

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://${AZURE_TENANT_NAME}.b2clogin.com/${AZURE_TENANT_NAME}.onmicrosoft.com/${AZURE_POLICY_NAME}/discovery/v2.0/keys
          audiences: ${AZURE_CLIENT_ID}

server:
  port: 8083

azure:
  b2c:
    tenant: ${AZURE_TENANT_NAME}
    client-id: ${AZURE_CLIENT_ID}
    policy: ${AZURE_POLICY_NAME}

cors:
  allowed-origins: "*"
