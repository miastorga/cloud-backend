spring:
  application:
    name: ms-productor-ubicaciones

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka1:19092,kafka2:29092,kafka3:39092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "ubicacion:com.transporte.productor.model.Ubicacion"

server:
  port: 8081
